spring.application.name=Stock-Market-Analysis
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Stock_Market_Analysis}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

twelvedata.base-url=${TWELVEDATA_BASE_URL:https://api.twelvedata.com}
twelvedata.api-key=${TWELVEDATA_API_KEY}
twelvedata.exchange=${TWELVEDATA_EXCHANGE:NSE}
